<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ouvrir dans Tripadvisor</title>
<style>body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,system-ui,sans-serif;background:#F4F1EA;color:#1F2A33;text-align:center;padding:24px;box-sizing:border-box}
a.b{display:block;width:100%;max-width:340px;background:#34E0A1;color:#000;font-weight:700;font-size:20px;text-decoration:none;padding:20px;border-radius:40px;margin:18px 0}
p{font-size:15px;line-height:1.5;max-width:340px;color:#555}a.w{color:#555;font-size:14px}</style></head><body>
<p>Touchez le bouton pour ouvrir la fiche dans l’application Tripadvisor.</p>
<a class="b" id="b" href="#">Ouvrir dans Tripadvisor</a>
<p>Si c’est la page web qui s’ouvre : appui long sur le bouton, puis « Ouvrir dans Tripadvisor ». L’iPhone retiendra ce choix.</p>
<a class="w" id="w" href="#">Voir la page web</a>
<script>var u=new URLSearchParams(location.search).get('u')||'';if(!/^https:\/\/www\.tripadvisor\.[a-z.]+\//.test(u))u='https://www.tripadvisor.fr/';document.getElementById('b').href=u;document.getElementById('w').href=u;</script>
</body></html>
